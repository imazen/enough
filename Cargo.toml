[workspace]
resolver = "2"
members = [
    "crates/enough",
    "crates/almost-enough",
    "crates/enough-tokio",
    "crates/enough-ffi",
    "crates/how-far",
    "crates/how-far-along",
    "tests/test-basic",
    "tests/test-atomic",
    "tests/test-timeout",
    "tests/test-child",
    "tests/test-rayon",
    "tests/test-tokio",
    "tests/test-ffi",
    "tests/test-codec-mock",
    "tests/test-ergonomics",
    "tests/test-or-do-this",
    "tests/test-how-far-codec",
    "tests/test-how-far-pipeline",
    "tests/test-how-far-app",
]
# `apidoc/` is the CI-free public-API snapshot runner: excluded so plain
# `cargo test` and every CI job (incl. --all-features) never compile its
# dependency tree or run rustdoc. Regenerate via `just api-doc`.
exclude = ["apidoc", "dev/cancel-latency", "dev/how-far-wasm", "dev/how-far-browser"]

[workspace.package]
version = "0.4.4"
edition = "2024"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
repository = "https://github.com/imazen/enough"
keywords = ["cancellation", "cooperative", "async", "ffi", "no_std"]
categories = ["concurrency", "no-std", "rust-patterns"]

[workspace.dependencies]
enough = { version = "0.4.4", path = "crates/enough", default-features = false }
almost-enough = { version = "0.4.4", path = "crates/almost-enough", features = ["std"] }
zenbench = "0.1.6"
# enough-tokio and enough-ffi have independent versioning
enough-tokio = { path = "crates/enough-tokio" }
enough-ffi = { path = "crates/enough-ffi" }
how-far = { version = "0.1.0", path = "crates/how-far" }
how-far-along = { path = "crates/how-far-along", default-features = false }

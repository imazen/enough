[package]
name = "how-far-example-codec"
version = "0.0.0"
edition.workspace = true
rust-version = "1.88"
publish = false
description = "A pretend image codec that reports through how-far, as a real one would"

[features]
default = ["std"]
# Parallel encoders: Rayon, scoped and spawned threads.
std = ["dep:rayon"]

# A library adopting how-far needs only the interface crate. No tracker here.
[dependencies]
how-far.workspace = true
rayon = { version = "1.12.0", optional = true }

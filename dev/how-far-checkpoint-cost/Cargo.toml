[package]
name = "how-far-checkpoint-cost"
version = "0.0.0"
edition = "2024"
publish = false
description = "What how-far costs for each observer and each library scenario, counted with perf"

[dependencies]
almost-enough = { path = "../../crates/almost-enough", features = ["poll-meter"] }
enough = { path = "../../crates/enough" }
enough-tokio = { path = "../../crates/enough-tokio" }
tokio-util = { version = "0.7.19", default-features = false }
how-far = { path = "../../crates/how-far", features = ["adapters"] }
how-far-along = { path = "../../crates/how-far-along", features = ["callback"] }
how-far-really = { path = "../../crates/how-far-really" }

[workspace]

[package]
name = "test-how-far-app"
version = "0.0.0"
edition = "2024"
rust-version = "1.88"
publish = false
description = "Applications driving how-far libraries across crates, threads, pools and runtimes"

[dependencies]
how-far = { workspace = true, features = ["checked"] }
how-far-really = { path = "../../crates/how-far-really" }
almost-enough = { workspace = true }
how-far-along = { path = "../../crates/how-far-along", features = ["std", "json"] }
rayon = "1.12.0"
test-how-far-codec = { path = "../test-how-far-codec" }
test-how-far-pipeline = { path = "../test-how-far-pipeline" }
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "sync", "macros"] }

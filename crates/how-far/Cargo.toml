[package]
name = "how-far"
version = "0.1.0"
edition.workspace = true
rust-version = "1.85"
license.workspace = true
repository.workspace = true
description = "Cancellation, progress, and weighted phases through one interface for library authors"
keywords = ["progress", "cancellation", "no_std"]
categories = ["concurrency", "no-std"]

[dependencies]
# `alloc` gives `Arc<dyn Stop>` its `Stop` impl, which `PulseHandle` relies on.
enough = { workspace = true, features = ["alloc"] }

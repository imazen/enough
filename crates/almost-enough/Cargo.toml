[package]
name = "almost-enough"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
keywords = ["cancellation", "cooperative", "async", "ffi", "no_std"]
categories = ["concurrency", "no-std", "rust-patterns"]
description = "Batteries-included ergonomic extensions for the `enough` cooperative cancellation crate"
exclude = [".gitignore"]

[features]
default = ["std"]
alloc = ["enough/alloc"]
std = ["alloc"]
# PollMeter instrumentation adds ~10-15ms compile time; opt-in only
poll-meter = ["std"]

[dependencies]
enough = { workspace = true, default-features = false }

[dev-dependencies]
zenbench = { workspace = true }

[[bench]]
name = "stop_check"
harness = false

[[example]]
name = "stop_ordering"
required-features = ["std"]

[[example]]
name = "debounced_lateness"
required-features = ["std"]

[[bench]]
name = "stop_check_zen"
harness = false

[[bench]]
name = "debounced_timeout"
harness = false

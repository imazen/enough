[package]
name = "how-far-really"
version = "0.1.0"
edition.workspace = true
rust-version = "1.88"
license.workspace = true
repository.workspace = true
description = "Opt-in diagnostics and checkpoint tuning for how-far"

[dependencies]
how-far.workspace = true
how-far-along = { workspace = true, features = ["std", "json"] }

[dev-dependencies]
how-far = { workspace = true, features = ["checked"] }
almost-enough.workspace = true
rayon = "1.12.0"
tokio = { version = "1.53.1", features = ["rt", "sync"] }
